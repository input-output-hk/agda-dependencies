# CI smoke test for agda-deps.
#
# Two jobs, one per supported Agda:
# - `build` (default): Agda 2.8.0 from Hackage on GHC 9.12.4. This is the
#   default `cabal.project`, so it's a plain Hackage build — no git fetch,
#   no submodules. Runs the full check suite incl. the golden snapshot.
# - `build-agda29` (opt-in): Agda 2.9.0 via `cabal.project.agda29`, which
#   pins an upstream agda/agda git commit (2.9.0 isn't on Hackage yet).
#   Builds Agda from source (slow, ~10 min on a cold cache) and re-runs the
#   golden check, so the 2.8/2.9 output parity stays enforced.
#
# Both cache `~/.cabal/store` + their build dir aggressively; cache keys
# include the relevant project file (Agda pin) and the cabal file (deps).
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: build (Agda 2.8, GHC 9.12.4)
    runs-on: ubuntu-latest

    steps:
    - name: Check out the repository
      uses: actions/checkout@v4

    - name: Set up Haskell (GHC 9.12.4 + cabal 3.16)
      uses: haskell-actions/setup@v2
      with:
        ghc-version: '9.12.4'
        cabal-version: '3.16'

    - name: Cache cabal store
      uses: actions/cache@v4
      with:
        path: |
          ~/.cabal/store
          ~/.cabal/packages
          dist-newstyle
        # cabal.project pins Agda ==2.8.0; agda-deps.cabal pins deps.
        # GHC version is part of the key so a future GHC bump invalidates
        # without manual nudging.
        key: ${{ runner.os }}-ghc9.12.4-agda28-${{ hashFiles('cabal.project', 'agda-deps.cabal') }}
        restore-keys: |
          ${{ runner.os }}-ghc9.12.4-agda28-

    - name: Update Hackage index
      run: cabal update

    - name: Dependency drift check
      # Catches dependency-resolution failures early, before we burn
      # time on the actual build.
      run: cabal build --dry-run

    - name: Build agda-deps
      # Agda 2.8.0 from Hackage; first run builds it, then cache hits.
      run: cabal build

    - name: Run behavior-preserving hardening tests
      run: cabal test hardening

    - name: Run agda-deps on the bundled test corpus (every output shape)
      run: |
        mkdir -p ci-out
        cabal run agda-deps -- --format=dot  -i test/ -o ci-out/ test/Test.agda
        cabal run agda-deps -- --format=json -i test/ -o ci-out/ test/Test.agda
        # --lazy: a module-level graph.json plus per-module detail files.
        cabal run agda-deps -- --format=json --lazy -i test/ -o ci-out/lazy test/Test.agda
        test -f ci-out/lazy/graph.json
        test -d ci-out/lazy/modules
        # The skeleton must carry the detail-file manifest and drop the
        # inline defs/edges blobs; that split is what the lazy page needs.
        grep -q '"moduleFiles"' ci-out/lazy/graph.json
        if grep -q '"defs"' ci-out/lazy/graph.json; then
          echo "lazy graph.json still inlines defs" >&2; exit 1
        fi
        # Expanded JSON, exercising the optional --with-* fields, for schema
        # validation and the golden check. MUST run on a cold .agdai cache:
        # a warm-loaded main module skips the dead-private recovery and
        # emits a slightly poorer graph (the "warm-.agdai edge loss"), and
        # the committed golden is the cold (complete) variant.
        rm -rf test/*.agdai test/_build
        cabal run agda-deps -- --format=json --json-mode=expanded --with-signatures \
          --with-term-hashes -i test/ -o ci-out/expanded test/Test.agda
        ls -la ci-out/

    - name: Validate expanded JSON against the wire schema
      # Guards the producer/consumer contract: agda-deps' freshly-generated
      # expanded output must match schema/graph-v2-expanded.schema.json.
      run: |
        pipx run check-jsonschema --schemafile schema/graph-v2-expanded.schema.json \
          ci-out/expanded/deps.json

    - name: Check the committed schema still matches the Haskell source of truth
      # The expanded wire shape is described once in AgdaDeps.Backend.Wire;
      # `--emit-schema` regenerates the JSON Schema from it. This guards
      # against *silent* schema drift (a new producer field that plain
      # JSON-Schema validation would accept because additionalProperties is
      # open): if the generated schema diverges from the committed oracle,
      # the wire shape changed and schema/graph-v2-expanded.schema.json must
      # be updated deliberately in the same change.
      run: |
        cabal run -v0 agda-deps -- --emit-schema > ci-out/generated.schema.json
        python3 schema/check_schema.py ci-out/generated.schema.json \
          schema/graph-v2-expanded.schema.json

    - name: --show-defaults and doctor document every config key
      # Both hand-maintained mirrors of the config key set must list exactly
      # the keys the FromJSON Config instance reads: the commented sample
      # .agda-deps.yml emitted by --show-defaults (Config.showDefaultsYaml)
      # and the `agda-deps doctor` key table (Doctor.knownFields, which would
      # otherwise report a good key as unknown).
      run: |
        cabal run -v0 agda-deps -- --show-defaults > ci-out/show-defaults.yml
        python3 schema/show_defaults_check.py ci-out/show-defaults.yml \
          src/AgdaDeps/Config.hs src/AgdaDeps/Doctor.hs

    - name: doctor accepts the seeded config and rejects a broken one
      # The sample --show-defaults writes must pass its own checker, both as
      # seeded (all commented) and fully uncommented (every key at its
      # default, so every key must be known and well-typed). A config with a
      # misspelled key must exit non-zero.
      run: |
        mkdir -p ci-out/doctor
        cp ci-out/show-defaults.yml ci-out/doctor/.agda-deps.yml
        cabal run -v0 agda-deps -- doctor --config=ci-out/doctor/.agda-deps.yml
        sed 's/^#\([a-z][a-z-]*\):/\1:/' ci-out/show-defaults.yml \
          > ci-out/doctor/all.yml
        cabal run -v0 agda-deps -- doctor --config=ci-out/doctor/all.yml
        printf 'out_dir: out\n' > ci-out/doctor/typo.yml
        if cabal run -v0 agda-deps -- doctor --config=ci-out/doctor/typo.yml; then
          echo "doctor accepted an unknown key" >&2
          exit 1
        fi

    - name: Check expanded output against the golden snapshot
      # Content regression guard (beyond shape/schema): node states, kinds,
      # edges, provenance, reexports, subterm hashes must match the
      # committed golden. Normalises away build- / environment-volatile
      # fields (producer, layout x/y, absolute file paths) first. Reuses
      # the --with-signatures --with-term-hashes output generated above.
      # If a change is intended, regenerate:
      #   agda-deps --json-mode=expanded --with-signatures --with-term-hashes … |
      #     python3 schema/golden_check.py emit /dev/stdin > test/golden/expanded.golden.json
      run: |
        python3 schema/golden_check.py check ci-out/expanded/deps.json \
          test/golden/expanded.golden.json

    - name: packed-analytical carries the same fidelity as expanded
      # Locks the packed-complete acceptance gate: a decoded
      # --packed-analytical graph must equal the expanded form
      # node-for-node (kind/line/access/type/subterm hashes). Both runs
      # start cold so the main module's dead-private recovery is the
      # complete variant in both (a warm .agdai would degrade only one
      # side and produce a spurious mismatch). The expanded side is the
      # cold ci-out/expanded run above, which used the same flags.
      run: |
        rm -rf test/*.agdai test/_build
        cabal run -v0 agda-deps -- --format=json --json-mode=packed \
          --packed-analytical --with-signatures --with-term-hashes \
          -i test/ -o ci-out/packed test/Test.agda
        rm -rf test/*.agdai test/_build
        cabal run -v0 agda-deps -- --format=json --json-mode=packed --lazy \
          --packed-analytical --with-signatures --with-term-hashes \
          -i test/ -o ci-out/packed-lazy test/Test.agda
        python3 schema/packed_analytical_check.py \
          ci-out/packed/deps.json ci-out/expanded/deps.json ci-out/packed-lazy

    - name: keep-going emits a graph on a broken corpus
      # Locks the --keep-going best-effort guarantee: one module whose
      # type-check fails (instance-resolution error leaving unsolved
      # metas — the class that used to kill the partial pass with a bare
      # exit 120 via __IMPOSSIBLE__ in reification) must still produce a
      # deps.json with the healthy siblings' defs/edges/signatures and
      # the broken module in failedModules[]. Uses the full flag set the
      # agda-explore daemon runs with. Corpus: test-keepgoing/ (kept
      # outside test/ so the main corpus stays type-correct).
      run: |
        cabal run -v0 agda-deps -- --format=json --json-mode=expanded \
          --no-externals --keep-going --with-term-hashes --min-term-depth=3 \
          --with-signatures -i test-keepgoing -o ci-out/keepgoing \
          test-keepgoing/Entry.agda
        python3 - <<'EOF'
        import json
        g = json.load(open("ci-out/keepgoing/deps.json"))
        assert g.get("failedModules") == ["Broken"], g.get("failedModules")
        defs = {d["name"]: d for d in g["definitions"]}
        assert "Good.double" in defs and "Good.quadruple" in defs, sorted(defs)
        assert ["Good.quadruple", "Good.double"] in g["definitionEdges"]
        assert "type" in defs["Good.quadruple"], "signatures missing in partial pass"
        # Section telescopes must survive mergeIfaceSig. Agda prepends the
        # parent's binders to a `where` helper, so `helper` elaborates to
        # arity 2; argUsage subtracts that prefix via lookupSection, which
        # returns EmptyTel *without erroring* if sigSections was not merged.
        # Without the merge this reads {"removable": [0, 1], "arity": 2}.
        # `binders` is shifted with the verdict it annotates, so the same
        # assertion pins the names too: the parent's binder IS named (`n`,
        # visible in `type`) while the helper's own is not, so an unshifted
        # read would show {"hiding": "explicit", "name": "n"} here. The
        # binder's `type` comes from --with-signatures and is rendered in
        # the context of the binders before it, which the partial pass's
        # rebuilt import state has to supply too.
        helper = next(d for n, d in defs.items() if n.startswith("Good.helper@"))
        assert helper.get("argUsage") == {
            "removable": [0], "erasable": [], "arity": 1,
            "binders": {"0": {"hiding": "explicit",
                              "type": "Agda.Builtin.Nat.Nat"}},
        }, f"section telescope lost in the partial pass: {helper.get('argUsage')}"
        print("keep-going fixture OK")
        EOF

    - name: silent unsolved metas are first-class under --allow-unsolved-metas
      # Locks the honest-?/silent-meta split: under --allow-unsolved-metas
      # a missing record field elaborates to a meta nothing can solve, the
      # module "succeeds", and failedModules stays [] — so the graph must
      # carry the evidence gap itself: a per-def `unsolvedMetas` count on
      # every def mentioning a silent meta, and a module→lines
      # `unsolvedModules` rollup. An honest interaction `?` must stay a
      # bare state-H def (no count, no rollup row). Corpus: test-unsolved/
      # (kept outside test/ so the main corpus needs no flag).
      run: |
        rm -rf test-unsolved/*.agdai test-unsolved/_build
        cabal run -v0 agda-deps -- --allow-unsolved-metas --format=json \
          --json-mode=expanded -i test-unsolved -o ci-out/unsolved \
          test-unsolved/Entry.agda
        python3 - <<'EOF'
        import json
        g = json.load(open("ci-out/unsolved/deps.json"))
        assert g.get("failedModules") == [], g.get("failedModules")
        assert g.get("unsolvedModules") == \
            {"MetaProbe": {"metas": [24], "constraints": []}}, \
            g.get("unsolvedModules")
        defs = {d["name"]: d for d in g["definitions"]}
        assert defs["MetaProbe.t"]["state"] == "H"
        assert defs["MetaProbe.t"].get("unsolvedMetas") == 1, defs["MetaProbe.t"]
        # the honest ? — hole, but NOT a silent meta
        assert defs["Entry.honest"]["state"] == "H"
        assert "unsolvedMetas" not in defs["Entry.honest"], defs["Entry.honest"]
        # the marker node itself carries the count too
        markers = [d for n, d in defs.items() if "unsolved#meta." in n]
        assert len(markers) == 1 and markers[0].get("unsolvedMetas") == 1, markers
        print("unsolved-metas fixture OK")
        EOF

    - name: effective options are reported per module (--erasure)
      # `moduleEffectiveOptions` answers "can the advice in this module's
      # argUsage.erasable verdicts actually be taken": without --erasure,
      # `@0` is [AttributeKindNotEnabled] and every one of them is
      # un-appliable. It is read from the interface's EFFECTIVE options
      # (iOptionsUsed), not the file's own OPTIONS tokens, precisely so a
      # flag set on the command line or in the .agda-lib is seen — which is
      # what this step exercises. Run on the main corpus with the flag
      # added, so the committed golden (no --erasure) stays the no-flag
      # baseline and the field's absence there is itself an assertion.
      run: |
        rm -rf test/*.agdai test/_build
        cabal run -v0 agda-deps -- --erasure --format=json \
          --json-mode=expanded -i test/ -o ci-out/erasure test/Test.agda
        python3 - <<'EOF'
        import json
        on = json.load(open("ci-out/erasure/deps.json"))
        off = json.load(open("ci-out/expanded/deps.json"))
        meo = on.get("moduleEffectiveOptions")
        assert meo, "moduleEffectiveOptions missing under --erasure"
        assert meo.get("ArgUsage") == ["--erasure"], meo.get("ArgUsage")
        # Every module the graph knows must be answered, not just some.
        assert set(meo) >= {"Test", "ArgUsage", "Nat"}, sorted(meo)
        # …and the field must be OMITTED, not empty, without the flag.
        assert "moduleEffectiveOptions" not in off, "emitted with no flag"
        print("effective-options fixture OK")
        EOF

    - name: match-constant probe (unshipped analysis) still behaves
      # AgdaDeps.MatchConstant is a MEASUREMENT PROBE, not a wire feature: it
      # emits nothing to graph.json and runs only under
      # AGDA_DEPS_MATCH_CONSTANT. It was measured and rejected for the wire
      # (1 sound finding in 15298 stdlib functions, 0 in 6795 Jolteon ones —
      # see Backlog.md), but the analysis is kept so the number can be
      # re-measured on any corpus. Nothing else covers it, so assert the
      # fixture here: five positions that must fire, and the controls that
      # must not — above all `notInv`, the type-refinement case that made 101
      # of 102 raw stdlib candidates unsound.
      run: |
        rm -rf test-matchconstant/*.agdai test-matchconstant/_build
        AGDA_DEPS_MATCH_CONSTANT=1 cabal run -v0 agda-deps -- --format=json \
          --json-mode=expanded -i test-matchconstant -o ci-out/mc \
          test-matchconstant/MC.agda 2> ci-out/mc.err
        python3 - <<'EOF'
        import re
        hits = {}
        for line in open("ci-out/mc.err"):
            if line.startswith("MC-HIT "):
                p = line.split()
                hits[re.sub(r"@\d+$", "@L", p[1])] = p[2]
        expected = {
            "MC.f1": "mc=[0]",        # motivating case
            "MC.f4": "mc=[0]",        # constructor with an ignored field (slab)
            "MC.f6": "mc=[0]",        # catch-all branch
            "MC.f10": "mc=[0]",       # mixed arities
            "MC.helper@L": "mc=[0]",  # where helper: its OWN position 0
        }
        assert hits == expected, f"probe drifted: {hits}"
        # And the controls, named individually so a regression says which:
        for name in ("MC.f2", "MC.f3", "MC.f5", "MC.f7", "MC.f8",
                     "MC.mkR", "MC.notInv"):
            assert name not in hits, f"{name} must not fire"
        print("match-constant probe OK (5 findings, 7 controls silent)")
        EOF

    - name: incremental cache reproduces the golden byte-for-byte
      # Locks --incremental: a cold run (writes fragments) and a warm
      # rerun (serves them via preModule Skip) must emit identical JSON,
      # and both must still match the golden snapshot. Run 1 starts from
      # a cold .agdai cache so the main module's fragment captures the
      # complete (fresh-check) variant; run 2 is warm on both the Agda
      # and the fragment side — the realistic fast path.
      run: |
        rm -rf test/*.agdai test/_build
        cabal run -v0 agda-deps -- --incremental --format=json \
          --json-mode=expanded --with-signatures --with-term-hashes \
          -i test/ -o ci-out/inc test/Test.agda
        cp ci-out/inc/deps.json ci-out/inc/deps.run1.json
        cabal run -v0 agda-deps -- --incremental --format=json \
          --json-mode=expanded --with-signatures --with-term-hashes \
          -i test/ -o ci-out/inc test/Test.agda
        cmp ci-out/inc/deps.run1.json ci-out/inc/deps.json
        python3 schema/golden_check.py check ci-out/inc/deps.json \
          test/golden/expanded.golden.json

    - name: incremental serialise — no-op skip, edit-detect, GC
      # Locks the P2 serialise cache and the GC. The warm run above
      # already wrote the manifest; (1) a third no-op run must announce
      # the skip and stay byte-identical; (2) editing a module must NOT
      # skip and must reflect the change (no stale output); (3) a planted
      # stale fragment must be pruned; (4) lazy mode must not rewrite
      # unchanged per-module files on a no-op rebuild.
      run: |
        # (1) no-op skip
        cabal run -v0 agda-deps -- --incremental --format=json \
          --json-mode=expanded --with-signatures --with-term-hashes \
          -i test/ -o ci-out/inc test/Test.agda 2>ci-out/inc.noop.log
        grep -q "skipped re-emit" ci-out/inc.noop.log
        cmp ci-out/inc/deps.run1.json ci-out/inc/deps.json
        # (2) edit-detect: a new def must appear, skip must not fire
        printf '\nfortyTwo : Nat\nfortyTwo = suc (suc zero)\n' >> test/Nat.agda
        cabal run -v0 agda-deps -- --incremental --format=json \
          --json-mode=expanded --with-signatures --with-term-hashes \
          -i test/ -o ci-out/inc test/Test.agda 2>ci-out/inc.edit.log
        # (`! grep` would never fail the step: bash -e ignores negated commands.)
        if grep -q "skipped re-emit" ci-out/inc.edit.log; then
          echo "edit did not defeat the no-op skip" >&2; exit 1
        fi
        grep -q '"Nat.fortyTwo"' ci-out/inc/deps.json
        git checkout test/Nat.agda
        # (2b) the source scan is an input too: a new module under -i that
        #      nothing imports recompiles nothing, but must still defeat the
        #      skip and appear in sourceFiles
        printf 'module Orphan where\n' > test/Orphan.agda
        cabal run -v0 agda-deps -- --incremental --format=json \
          --json-mode=expanded --with-signatures --with-term-hashes \
          -i test/ -o ci-out/inc test/Test.agda 2>ci-out/inc.orphan.log
        if grep -q "skipped re-emit" ci-out/inc.orphan.log; then
          echo "new source file did not defeat the no-op skip" >&2; exit 1
        fi
        grep -q 'Orphan.agda"' ci-out/inc/deps.json
        rm test/Orphan.agda
        # (3) GC: plant a stale fragment, rerun, confirm it is pruned
        touch ci-out/inc/.agda-deps-cache/Zombie-deadbeefdeadbeef.frag
        rm -rf test/*.agdai test/_build
        cabal run -v0 agda-deps -- --incremental --format=json \
          --json-mode=expanded --with-signatures --with-term-hashes \
          -i test/ -o ci-out/inc test/Test.agda >/dev/null 2>&1
        test ! -f ci-out/inc/.agda-deps-cache/Zombie-deadbeefdeadbeef.frag
        # (4) lazy: no module-file rewrites on a no-op rebuild
        rm -rf test/*.agdai test/_build ci-out/lazyinc
        cabal run -v0 agda-deps -- --incremental --format=json --lazy \
          -i test/ -o ci-out/lazyinc test/Test.agda >/dev/null 2>&1
        find ci-out/lazyinc/modules -name '*.json' -printf '%T@ %p\n' | sort > ci-out/mt.before
        cabal run -v0 agda-deps -- --incremental --format=json --lazy \
          -i test/ -o ci-out/lazyinc test/Test.agda >/dev/null 2>&1
        find ci-out/lazyinc/modules -name '*.json' -printf '%T@ %p\n' | sort > ci-out/mt.after
        diff ci-out/mt.before ci-out/mt.after
        echo "incremental serialise + GC OK"

    - name: config keys, term-hash identity, DOT quoting, failed externals
      # Regressions the golden cannot see.
      # (1) quiet / skip-agda / keep-going / lenient-imports are decided in
      #     Main before Agda parses argv; each must work from the config
      #     file exactly as its CLI flag does (defaults → config → CLI).
      # (2) Subterm hashes name references by node key: Collision's two
      #     same-named `where` helpers (`QED`, raw name Collision._.QED)
      #     are different nodes, so useA and useB must hash apart. Depth 1,
      #     because their bodies are below the golden's --min-term-depth.
      # (3) The --skip-agda DOT renderer quotes names as DOT, not JSON
      #     (P' must not become "P'").
      # (4) --no-externals drops a failed module outside the project root
      #     like any other external.
      run: |
        mkdir -p ci-out/fixes
        # (1)
        printf 'skip-agda: true\nquiet: true\n' > ci-out/fixes/skip.yml
        cabal run -v0 agda-deps -- --config=ci-out/fixes/skip.yml --format=json \
          --json-mode=expanded -i test/ -o ci-out/fixes/skip test/Test.agda \
          2>ci-out/fixes/skip.err
        if grep -q '^agda-deps:' ci-out/fixes/skip.err; then
          echo "config quiet ignored" >&2; exit 1
        fi
        printf 'keep-going: true\n' > ci-out/fixes/kg.yml
        cabal run -v0 agda-deps -- --config=ci-out/fixes/kg.yml --format=json \
          --json-mode=expanded -i test-keepgoing -o ci-out/fixes/kg \
          test-keepgoing/Entry.agda
        printf 'lenient-imports: true\n' > ci-out/fixes/li.yml
        rm -rf test-unsolved/*.agdai test-unsolved/_build
        cabal run -v0 agda-deps -- --config=ci-out/fixes/li.yml --format=json \
          -i test-unsolved -o ci-out/fixes/li test-unsolved/Entry.agda
        # (2)
        cabal run -v0 agda-deps -- --format=json --json-mode=expanded \
          --with-term-hashes --min-term-depth=1 \
          -i test/ -o ci-out/fixes/hash1 test/Test.agda
        # (3)
        mkdir -p ci-out/fixes/quote
        printf "module P' where\n" > "ci-out/fixes/quote/P'.agda"
        printf "module Q where\nopen import P'\n" > ci-out/fixes/quote/Q.agda
        cabal run -v0 agda-deps -- --skip-agda --format=dot \
          -i ci-out/fixes/quote ci-out/fixes/quote/Q.agda > ci-out/fixes/quote.dot
        grep -qF "\"Q\" -> \"P'\";" ci-out/fixes/quote.dot
        # (4)
        mkdir -p ci-out/fixes/ext/proj ci-out/fixes/ext/lib
        cp test-keepgoing/Good.agda test-keepgoing/Broken.agda ci-out/fixes/ext/lib/
        printf 'module Entry where\n\nopen import Good\nopen import Broken\n' \
          > ci-out/fixes/ext/proj/Entry.agda
        printf 'name: proj\ninclude: .\n' > ci-out/fixes/ext/proj/proj.agda-lib
        (cd ci-out/fixes/ext/proj && cabal run -v0 agda-deps -- --keep-going \
          --no-externals --format=json --json-mode=expanded -i . -i ../lib \
          -o ../out Entry.agda)
        python3 - <<'EOF'
        import json
        load = lambda p: json.load(open(f"ci-out/fixes/{p}/deps.json"))
        assert load("skip")["definitions"] == [], "config skip-agda ignored"
        assert load("kg").get("failedModules") == ["Broken"], "config keep-going ignored"
        g = load("hash1")
        h = dict(zip([d["name"] for d in g["definitions"]], g["definitionSubtermHashes"]))
        assert h["Collision.useA"] != h["Collision.useB"], "same-named where helpers hash alike"
        ext = load("ext/out")
        assert ext.get("failedModules") == [], ext.get("failedModules")
        assert "Broken" not in ext["modules"], ext["modules"]
        assert "Broken" in ext["externals_summary"]["modules"]
        print("config keys, hash identity, DOT quoting, failed externals OK")
        EOF

    - name: Upload generated artefacts
      uses: actions/upload-artifact@v4
      with:
        name: agda-deps-ci-out
        path: ci-out/
        if-no-files-found: warn

  # Opt-in Agda 2.9 build. Keeps the 2.8/2.9 output parity enforced: the
  # graph must be byte-identical across both Agda versions (the golden was
  # generated on 2.8, and this re-checks the 2.9 output against it). Builds
  # Agda 2.9.0 from a git pin (cabal.project.agda29), so a cold cache is
  # slow (~10 min); the store + dist-agda29 are cached to keep reruns fast.
  build-agda29:
    name: build (Agda 2.9, GHC 9.12.4)
    runs-on: ubuntu-latest

    steps:
    - name: Check out the repository
      uses: actions/checkout@v4

    - name: Set up Haskell (GHC 9.12.4 + cabal 3.16)
      uses: haskell-actions/setup@v2
      with:
        ghc-version: '9.12.4'
        cabal-version: '3.16'

    - name: Cache cabal store (Agda 2.9)
      uses: actions/cache@v4
      with:
        path: |
          ~/.cabal/store
          ~/.cabal/packages
          dist-agda29
        # Keyed on the 2.9 project file (Agda git commit) + the cabal file.
        key: ${{ runner.os }}-ghc9.12.4-agda29-${{ hashFiles('cabal.project.agda29', 'agda-deps.cabal') }}
        restore-keys: |
          ${{ runner.os }}-ghc9.12.4-agda29-

    - name: Skip Agda's test-corpus submodules
      # Agda's git repo carries std-lib + cubical as submodules (its own
      # test corpus). cabal recurses into them when it fetches/syncs the
      # source-repository-package, but std-lib tracks agda-stdlib's
      # `experimental` branch, which is regularly rebased — so the pinned
      # submodule commit gets garbage-collected upstream and the recursive
      # fetch fails ("not our ref …"). These submodules aren't needed to
      # build Agda as a library, so tell git to skip them globally.
      # `cabal build` runs `git submodule update` (governed by
      # submodule.<name>.update) and `cabal update` runs `git fetch`
      # (governed by fetch.recurseSubmodules) — both must be disabled.
      run: |
        git config --global submodule.std-lib.update none
        git config --global submodule.cubical.update none
        git config --global fetch.recurseSubmodules false

    - name: Update Hackage index
      run: cabal update

    - name: Build agda-deps against Agda 2.9
      # First time through this is slow (Agda 2.9 from git source).
      run: cabal build --project-file=cabal.project.agda29 --builddir=dist-agda29

    - name: Run behavior-preserving hardening tests (Agda 2.9)
      run: |
        cabal test --project-file=cabal.project.agda29 \
          --builddir=dist-agda29 hardening

    - name: Expanded output matches the golden (2.8/2.9 parity)
      # Must run cold (dead-private recovery) — see the 2.8 job's note.
      run: |
        mkdir -p ci-out29
        rm -rf test/*.agdai test/_build
        cabal run -v0 --project-file=cabal.project.agda29 --builddir=dist-agda29 \
          agda-deps -- --format=json --json-mode=expanded --with-signatures \
          --with-term-hashes -i test/ -o ci-out29/expanded test/Test.agda
        python3 schema/golden_check.py check ci-out29/expanded/deps.json \
          test/golden/expanded.golden.json
